[project]
name = "model-selector"
version = "0.1.0"
description = "Discover LLM/AI models + prices, probe them with task suites, rank cheapest-that-works for novel tasks."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "openai>=1.60",
  "pyyaml>=6.0",
  "markdownify>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
model-selector = "model_selector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_selector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
